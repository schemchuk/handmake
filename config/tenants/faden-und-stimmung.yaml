id: faden-und-stimmung
name: Faden und Stimmung
languages: [uk, de]

# Presence of a channel key means "enabled". Values hold per-channel
# settings; secret *names* only, never secret values (loader enforces this).
channels:
  telegram:
    channelId: TELEGRAM_CHANNEL_ID

contentStore:
  type: git-repo

meetingSchedule:
  weekday: thursday
  time: '14:00'
  timezone: Europe/Berlin

# Work of the week (F19) poll times; whether it runs is featureFlags.wotwPoll.
# Times use meetingSchedule.timezone.
workOfWeek:
  opens:
    weekday: monday
    time: '10:00'
  closes:
    weekday: wednesday
    time: '20:00'

# F18: announcement and reminder for each meeting (bot cron). Times use
# meetingSchedule.timezone. Templates are Ukrainian; {weekday}, {date} and
# {time} are filled with the announced meeting (Europe/Berlin wall time).
announcements:
  schedule:
    announcement:
      weekday: tuesday
      time: '18:00'
    reminder:
      weekday: thursday
      time: '10:00'
  templates:
    announcement: >-
      🧶 Нагадуємо: наступна зустріч нашого гуртка — у {weekday}, {date} о {time},
      у Landshut, Niedermayerstr. 85! Пряжа, чаї та гарна компанія — позитив з усіх боків.
      Деталі в каналі.
    reminder: >-
      🧶 Сьогодні о {time} зустріч нашого гуртка, як і завжди, в Landshut, Niedermayerstr. 85!
      Не забудь хороший настрій.

featureFlags:
  translation: true
  wotwPoll: false

# Commercialization stub: must stay empty (spec section 8).
offerings: []
