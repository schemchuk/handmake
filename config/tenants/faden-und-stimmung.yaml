id: faden-und-stimmung
name: Faden und Stimmung
languages: [uk, de]

# Presence of a channel key means "enabled". Values hold per-channel
# settings; secret *names* only, never secret values (loader enforces this).
channels:
  telegram:
    channelId: TELEGRAM_CHANNEL_ID

contentStore:
  type: git-repo

meetingSchedule:
  weekday: thursday
  time: '14:00'
  timezone: Europe/Berlin

# Work of the week (F19) poll times; whether it runs is featureFlags.wotwPoll.
# Times use meetingSchedule.timezone.
workOfWeek:
  opens:
    weekday: monday
    time: '10:00'
  closes:
    weekday: wednesday
    time: '20:00'

# F18: announcement and reminder for each meeting (bot cron). Times use
# meetingSchedule.timezone. Templates are Ukrainian; {weekday}, {date} and
# {time} are filled with the announced meeting (Europe/Berlin wall time).
announcements:
  schedule:
    announcement:
      weekday: tuesday
      time: '18:00'
    reminder:
      weekday: thursday
      time: '10:00'
  templates:
    announcement: >-
      🧶 Нагадуємо: наступна зустріч нашого гуртка — у {weekday}, {date} о {time},
      у Landshut, Niedermayerstr. 85! Пряжа, чаї та гарна компанія — позитив з усіх боків.
      Деталі в каналі.
    reminder: >-
      🧶 Сьогодні о {time} зустріч нашого гуртка, як і завжди, в Landshut, Niedermayerstr. 85!
      Не забудь хороший настрій.

# Website (ADR 011, ADR 016). German at `/`, Ukrainian under `/uk/`.
# Theme "Lookbook": cool white paper, near-black ink, grey meta text,
# madder-red running-stitch dividers; one wide grotesk for everything.
site:
  baseUrl: https://fadenundstimmung.de
  defaultLanguage: de
  theme:
    colors:
      paper: '#F0F0EC'
      ink: '#1A1B20'
      muted: '#6F7077'
      rule: '#B3362B'
    fonts:
      display: Familjen Grotesk
      body: Familjen Grotesk
  # The /kreis/ page; "when" comes from meetingSchedule.
  circle:
    # Public Telegram channel (confirmed by Volodymyr 2026-11-02).
    joinUrl: https://t.me/Faden_und_Stimmung
    # DRAFT texts: the author confirms or rewrites them.
    texts:
      de:
        title: Handarbeitskreis
        what: >-
          Ein offener Kreis für Handarbeit: Wir sticken, stricken und nähen zusammen, tauschen
          Ideen aus und trinken Tee. Bring dein Projekt mit oder fang ein neues an.
        where: Niedermayerstr. 85, Landshut
      uk:
        title: Гурток рукоділля
        what: >-
          Відкритий гурток рукоділля: вишиваємо, в'яжемо і шиємо разом, ділимося ідеями та
          п'ємо чай. Принось свій проєкт або почни новий.
        where: Niedermayerstr. 85, Landshut

# F32: EUR estimates supplied by the operator; T43 verifies service prices.
ai:
  monthlyTargetEur: 20
  toleranceEur: 5
  translation:
    model: claude-opus-5-5
    inputEurPerMillion: 3.5
    outputEurPerMillion: 17.5

# Shows (ADR 015): fictional adult personas generated with fal on 2026-11-02.
# referenceImage is a key under show-input/v1/<tenant>/ in the private R2 bucket.
# EUR estimates sit above fal's list prices ($0.08/image, $0.35 per 5 s video).
shows:
  models:
    - id: lena
      name: Lena
      look: a woman in her early 30s with shoulder-length light brown hair
      referenceImage: persona-lena-v1
      fictional: true
      adult: true
    - id: marta
      name: Marta
      look: a woman in her mid 50s with short silver-grey hair and a warm smile
      referenceImage: persona-marta-v1
      fictional: true
      adult: true
    - id: jonas
      name: Jonas
      look: a man in his late 30s with short dark hair and a neatly trimmed beard
      referenceImage: persona-jonas-v1
      fictional: true
      adult: true
  image:
    model: fal-ai/nano-banana-2/edit
    eurPerImage: 0.1
  video:
    model: fal-ai/kling-video/v2.5-turbo/pro/image-to-video
    eurPerSecond: 0.08

featureFlags:
  translation: true
  wotwPoll: false

# Commercialization stub: must stay empty (spec section 8).
offerings: []
