name: Site

on:
  workflow_call:
    secrets:
      IMPRESSUM_NAME:
        required: true
      IMPRESSUM_STREET:
        required: true
      IMPRESSUM_CITY:
        required: true
      IMPRESSUM_EMAIL:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SITE_REQUIRE_LEGAL: 'true'
          # Legal approvals recorded in PR #80; T41b excludes test posts before indexing.
          SITE_INDEXABLE: 'true'
          IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
          IMPRESSUM_STREET: ${{ secrets.IMPRESSUM_STREET }}
          IMPRESSUM_CITY: ${{ secrets.IMPRESSUM_CITY }}
          IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
        run: pnpm --filter @handmake/site build

      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Use the lockfile-pinned Wrangler without changing the working directory.
        run: |
          export PATH="$GITHUB_WORKSPACE/apps/bot/node_modules/.bin:$PATH"
          wrangler pages deploy apps/site/dist --project-name fadenundstimmung --branch main
