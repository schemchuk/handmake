name: Generate and mark show
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Private job coordinates: {"tenantId","showId","jobId","version"}'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: show-${{ inputs.payload }}
  cancel-in-progress: false
jobs:
  execute:
    # Production gates are separate from dispatch; absent configuration fails closed.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install marking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Write job coordinates
        env:
          SHOW_JOB: ${{ inputs.payload }}
        run: printf '%s' "$SHOW_JOB" > "$RUNNER_TEMP/show-job.json"
      - name: Execute resumable show job
        env:
          SHOW_WORKER_ORIGIN: ${{ vars.SHOW_WORKER_ORIGIN }}
          SHOW_TRANSPORT_SECRET: ${{ secrets.SHOW_TRANSPORT_SECRET }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SHOW_ALLOW_PAID_CALLS: ${{ vars.SHOW_ALLOW_PAID_CALLS }}
          SHOW_VERIFIED_MODELS: ${{ vars.SHOW_VERIFIED_MODELS }}
        run: pnpm --filter @handmake/publisher exec tsx src/show-cli.ts "$RUNNER_TEMP/show-job.json"
      - name: Report setup or execution failure
        if: failure()
        env:
          SHOW_JOB: ${{ inputs.payload }}
          SHOW_WORKER_ORIGIN: ${{ vars.SHOW_WORKER_ORIGIN }}
          SHOW_TRANSPORT_SECRET: ${{ secrets.SHOW_TRANSPORT_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash, createHmac, randomUUID } from 'node:crypto';
          const job = JSON.parse(process.env.SHOW_JOB);
          const part = /^[A-Za-z0-9_-]{1,128}$/;
          if (![job.tenantId, job.showId, job.jobId].every(p => typeof p === 'string' && part.test(p)) ||
              !Number.isSafeInteger(job.version) || job.version < 0) throw new Error('invalid job');
          const origin = new URL(process.env.SHOW_WORKER_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password ||
              origin.pathname !== '/' || origin.search || origin.hash || !process.env.SHOW_TRANSPORT_SECRET)
            throw new Error('invalid transport');
          const url = new URL(`/internal/shows/${job.tenantId}/${job.showId}/${job.jobId}/${job.version}/next/finish`, origin);
          const body = JSON.stringify({ outcome: 'failed' });
          const time = String(Date.now()), nonce = randomUUID();
          const message = ['POST', url.pathname, time, nonce, '', createHash('sha256').update(body).digest('hex')].join('\n');
          try {
            const response = await fetch(url, {
              method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000), body,
              headers: {
                'x-show-time': time, 'x-show-nonce': nonce,
                'x-show-signature': createHmac('sha256', process.env.SHOW_TRANSPORT_SECRET).update(message).digest('hex'),
              },
            });
            await response.body?.cancel();
            if (!response.ok) throw new Error();
          } catch { console.error('Show failure notification rejected.'); process.exitCode = 1; }
          NODE
