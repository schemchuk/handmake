name: Publish

# Turns an approved draft (bot repository_dispatch or a manual payload) into a
# committed post folder, channel deliveries and a ledger, all on main under
# content/ only (ADR 003, AGENTS.md exception). After the deliveries it POSTs
# the signed "published" callback to the bot (T19), which moves the draft out
# of `publishing`. Idempotent: a re-run resumes from the ledger and never
# duplicates a delivered operation.
# Manual runs: start the workflow from the main branch; a run started on
# another branch pushes content commits to that branch.

on:
  repository_dispatch:
    types: [publish-post]
  workflow_dispatch:
    inputs:
      payload:
        description: >-
          Dispatch payload as JSON:
          {"tenantId","draftId","texts","fileIds","provenance"}
        required: true
        type: string
      live:
        description: >-
          Publish to the LIVE channel. Leave off to send to the private test
          channel (bot dispatches go live only while its PUBLISH_LIVE var is
          "true", i.e. after the T17 E2E on the test channel).
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  PNPM_VERSION: 12.14.0

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      is_show: ${{ steps.routing.outputs.is_show }}
      tenant_id: ${{ steps.routing.outputs.tenant_id }}
      show_id: ${{ steps.routing.outputs.show_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write dispatch payload
        # client_payload may carry bot-only routing keys (live); the
        # publisher's payload schema is strict, so strip them here.
        env:
          DISPATCH_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
        run: printf '%s' "$DISPATCH_PAYLOAD" | jq 'del(.live)' > "$RUNNER_TEMP/payload.json"

      - name: Select show copy routing
        id: routing
        run: |
          if jq -e '.kind == "show"' "$RUNNER_TEMP/payload.json" > /dev/null; then
            # Site deployment always reads main; refuse a different publication branch.
            test "$GITHUB_REF_NAME" = main
            {
              jq -er '
                .tenantId | select(type == "string" and test("^[a-z0-9][a-z0-9-]*$")) |
                "tenant_id=\(.)"' "$RUNNER_TEMP/payload.json"
              jq -er '
                .draftId | select(type == "string" and test("^[0-9A-HJKMNP-TV-Z]{26}$")) |
                "show_id=\(.)"' "$RUNNER_TEMP/payload.json"
              echo 'is_show=true'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Install show and work video tools
        timeout-minutes: 10
        run: |
          # Shows validate media; works with an author video strip its metadata (F39).
          if jq -e '.kind == "show" or (.kind == "work" and (.work.videoFileId // "") != "")' \
            "$RUNNER_TEMP/payload.json" > /dev/null; then
            .github/scripts/install-ffmpeg.sh
          fi

      - name: Publish to channels
        env:
          # Read-only R2 token for private show media; the Pages token stays in site.yml.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_EXCLUDE_POST: >-
            ${{ !((github.event_name == 'workflow_dispatch' && inputs.live)
              || (github.event_name == 'repository_dispatch' && github.event.client_payload.live == true)) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Live channel only when explicitly asked for: the live tick on a
          # manual run, or client_payload.live from the bot (its PUBLISH_LIVE
          # var). Everything else — every bot dispatch while PUBLISH_LIVE is
          # "false" — goes to the private test channel.
          TELEGRAM_CHANNEL_ID: >-
            ${{ (((github.event_name == 'workflow_dispatch' && inputs.live)
              || (github.event_name == 'repository_dispatch' && github.event.client_payload.live == true))
              && secrets.TELEGRAM_CHANNEL_ID) || secrets.TELEGRAM_TEST_CHANNEL_ID }}
          AUTHOR_CHAT_ID: ${{ secrets.AUTHOR_CHAT_ID }}
          OPERATOR_CHAT_ID: ${{ secrets.OPERATOR_CHAT_ID }}
          # Publisher -> bot "post is published" callback (T19, H7). The URL is
          # a repo variable (the Worker URL), the secret a GitHub Secret; the
          # same secret is a Worker secret. A callback failure never fails the
          # publish — the publisher alerts the operator instead.
          NAMES_ENDPOINT_SECRET: ${{ secrets.NAMES_ENDPOINT_SECRET }}
          PUBLISH_CALLBACK_URL: ${{ vars.PUBLISH_CALLBACK_URL }}
          PUBLISH_CALLBACK_SECRET: ${{ secrets.PUBLISH_CALLBACK_SECRET }}
          # Instagram (T26a3): Meta Graph API secrets, resolved by fixed name
          # at delivery. A missing secret fails the Instagram channel only —
          # Telegram stays first and unaffected.
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Facebook Page (T26b): same fixed-name resolution; a missing
          # secret fails the Facebook channel only.
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # The publisher pushes the content commit before delivery so Meta
          # can fetch fresh raw-GitHub photo URLs (framed carousel copies
          # included).
          CONTENT_PUSH_BEFORE_DELIVERY: 'true'
          PUBLISHER_GIT_NAME: github-actions[bot]
          PUBLISHER_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          pnpm --filter @handmake/publisher exec tsx src/cli.ts publish \
            "$RUNNER_TEMP/payload.json" --root "$GITHUB_WORKSPACE"

      # A failed run still leaves a committed failed ledger; it must reach
      # main so the re-run resumes instead of duplicating (PR #12 review).
      # Rebase before pushing: if the branch moved during the run, the push
      # would be rejected and the delivered posts would never be recorded.
      - name: Push published content
        if: always()
        env:
          PUBLISHER_GIT_NAME: github-actions[bot]
          PUBLISHER_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$PUBLISHER_GIT_NAME"
          git config user.email "$PUBLISHER_GIT_EMAIL"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebasing and retrying" >&2
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      # Fallback alert for failures before the publisher's own notifier ran
      # (install/checkout errors). The publisher notifies the operator itself
      # for delivery failures.
      - name: Alert operator on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPERATOR_CHAT_ID: ${{ secrets.OPERATOR_CHAT_ID }}
        run: |
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OPERATOR_CHAT_ID}" \
            --data-urlencode \
            "text=publish workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

  site:
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/site.yml
    secrets:
      IMPRESSUM_NAME: ${{ secrets.IMPRESSUM_NAME }}
      IMPRESSUM_STREET: ${{ secrets.IMPRESSUM_STREET }}
      IMPRESSUM_CITY: ${{ secrets.IMPRESSUM_CITY }}
      IMPRESSUM_EMAIL: ${{ secrets.IMPRESSUM_EMAIL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  copy-show:
    needs: [publish, site]
    # The default success() guard includes both the content push and site deploy.
    if: needs.publish.outputs.is_show == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A failed-job rerun must read pushed progress, not the dispatch commit.
          ref: main

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install show media validation tools
        timeout-minutes: 10
        run: |
          .github/scripts/install-ffmpeg.sh

      - name: Copy published show
        env:
          TENANT_ID: ${{ needs.publish.outputs.tenant_id }}
          SHOW_ID: ${{ needs.publish.outputs.show_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: >-
            ${{ (((github.event_name == 'workflow_dispatch' && inputs.live)
              || (github.event_name == 'repository_dispatch' && github.event.client_payload.live == true))
              && secrets.TELEGRAM_CHANNEL_ID) || secrets.TELEGRAM_TEST_CHANNEL_ID }}
          AUTHOR_CHAT_ID: ${{ secrets.AUTHOR_CHAT_ID }}
          OPERATOR_CHAT_ID: ${{ secrets.OPERATOR_CHAT_ID }}
          # Instagram (T26a3): Meta Graph API secrets for the show-copy
          # carousel delivery, and the pre-delivery content push (Meta
          # fetches the framed copies by raw-GitHub URL).
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Facebook Page (T26b): same fixed-name resolution for the
          # show-copy delivery; Meta fetches the show's own images.
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          CONTENT_PUSH_BEFORE_DELIVERY: 'true'
          PUBLISHER_GIT_NAME: github-actions[bot]
          PUBLISHER_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          pnpm --filter @handmake/publisher exec tsx src/cli.ts copy-show \
            "$TENANT_ID" "$SHOW_ID" --root "$GITHUB_WORKSPACE"

      - name: Push copy progress
        if: always()
        env:
          PUBLISHER_GIT_NAME: github-actions[bot]
          PUBLISHER_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git config user.name "$PUBLISHER_GIT_NAME"
          git config user.email "$PUBLISHER_GIT_EMAIL"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebasing and retrying" >&2
            sleep 5
          done
          echo "copy progress push failed after 3 attempts; reconcile before retry" >&2
          exit 1

      - name: Alert operator on copy failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPERATOR_CHAT_ID: ${{ secrets.OPERATOR_CHAT_ID }}
        run: |
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OPERATOR_CHAT_ID}" \
            --data-urlencode \
            "text=show copy workflow failed; site remains published: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
