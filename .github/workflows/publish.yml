name: Publish

# Turns an approved draft (bot repository_dispatch or a manual payload) into a
# committed post folder, channel deliveries and a ledger, all on main under
# content/ only (ADR 003, AGENTS.md exception). Idempotent: a re-run resumes
# from the ledger and never duplicates a delivered operation.
# Manual runs: start the workflow from the main branch; a run started on
# another branch pushes content commits to that branch.

on:
  repository_dispatch:
    types: [publish-post]
  workflow_dispatch:
    inputs:
      payload:
        description: >-
          Dispatch payload as JSON:
          {"tenantId","draftId","texts","fileIds","provenance"}
        required: true
        type: string
      live:
        description: >-
          Publish to the LIVE channel. Leave off to send to the private test
          channel (repository_dispatch from the bot always goes live).
        required: false
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  PNPM_VERSION: 12.14.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write dispatch payload
        env:
          DISPATCH_PAYLOAD: ${{ inputs.payload || toJson(github.event.client_payload) }}
        run: printf '%s' "$DISPATCH_PAYLOAD" > "$RUNNER_TEMP/payload.json"

      - name: Publish to channels
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Manual runs go to the private test channel unless live is ticked;
          # the bot's repository_dispatch always publishes to the live channel.
          TELEGRAM_CHANNEL_ID: >-
            ${{ github.event_name == 'repository_dispatch'
              || (inputs.live && secrets.TELEGRAM_CHANNEL_ID)
              || secrets.TELEGRAM_TEST_CHANNEL_ID }}
          AUTHOR_CHAT_ID: ${{ secrets.AUTHOR_CHAT_ID }}
          OPERATOR_CHAT_ID: ${{ secrets.OPERATOR_CHAT_ID }}
          PUBLISHER_GIT_NAME: github-actions[bot]
          PUBLISHER_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          pnpm --filter @handmake/publisher exec tsx src/cli.ts publish \
            "$RUNNER_TEMP/payload.json" --root "$GITHUB_WORKSPACE"

      # A failed run still leaves a committed failed ledger; it must reach
      # main so the re-run resumes instead of duplicating (PR #12 review).
      # Rebase before pushing: if the branch moved during the run, the push
      # would be rejected and the delivered posts would never be recorded.
      - name: Push published content
        if: always()
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt} rejected; rebasing and retrying" >&2
            sleep 5
          done
          echo "push failed after 3 attempts" >&2
          exit 1

      # Fallback alert for failures before the publisher's own notifier ran
      # (install/checkout errors). The publisher notifies the operator itself
      # for delivery failures.
      - name: Alert operator on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPERATOR_CHAT_ID: ${{ secrets.OPERATOR_CHAT_ID }}
        run: |
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${OPERATOR_CHAT_ID}" \
            --data-urlencode \
            "text=publish workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
