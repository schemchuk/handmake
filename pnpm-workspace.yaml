packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Security floors for transitive dependencies whose parents pin vulnerable versions
# (miniflare pins sharp/undici; typescript-estree pins minimatch). Remove once parents catch up.
overrides:
  sharp: ^0.35.5
  undici@7: ^7.30.2
  minimatch@10: ^11.0.1
