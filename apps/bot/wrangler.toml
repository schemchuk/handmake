name = "handmake-bot"
main = "src/index.ts"
compatibility_date = "2026-10-26"

# Create the database once:
#   pnpm --filter @handmake/bot exec wrangler d1 create handmake-bot
# then paste the printed database_id below and apply migrations:
#   pnpm --filter @handmake/bot db:migrate
[[d1_databases]]
binding = "DB"
database_name = "handmake-bot"
migrations_dir = "migrations"
database_id = "4cae8a3e-9869-4dad-a2b8-ab046365999e"

# Daily draft cleanup (architecture section 5: drafts older than 30 days are
# deleted). UTC.
[triggers]
crons = ["29 3 * * *"]

# Repository the publish dispatch targets (repository_dispatch → publish.yml).
# Not a secret; the fine-grained token is a Worker secret (GITHUB_DISPATCH_TOKEN).
# PUBLISH_LIVE: "true" sends bot dispatches to the LIVE channel; "false" (now,
# and until Volodymyr's go in the T17 E2E) sends them to the test channel.
[vars]
GITHUB_REPO = "schemchuk/handmake"
PUBLISH_LIVE = "false"
